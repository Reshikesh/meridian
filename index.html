<title>Meridian</title>
<!-- Inline, so a headed browser does not request /favicon.ico. No network. -->
<link rel="icon" href="data:,">

<!--
  Pre-paint theme. Must run before the stylesheets so the first paint is already
  in the right theme (QUALITY-BAR §3). Vanilla JS by decision 22; guarded because
  localStorage can throw outright on a file:// origin, and an uncaught throw here
  would leave a blank page.
-->
<script>
(function () {
  var theme = 'paper';
  try {
    var stored = localStorage.getItem('meridian:theme');
    if (stored === 'paper' || stored === 'graphite' || stored === 'blueprint') theme = stored;
  } catch (e) { /* keep the default */ }
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>

<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/screens.css">

<div id="app"></div>

<!--
  Vendored, loaded from disk. preact MUST precede hooks: hooks reads window.preact
  at load time and throws without it, so window.preactHooks is never created and
  the first hook call fails. See vendor/README.md.
-->
<script src="vendor/preact.umd.js"></script>
<script src="vendor/hooks.umd.js"></script>

  window.Meridian at load time, so a file listed before the one it needs fails

-->
